<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同源 iframe 子页</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:contain;display:block}
</style>
</head>
<body>
<video id="v" src="sintel.mp4" controls playsinline></video>
<script>
  window.childState = function () {
    var v = document.getElementById('v');
    return { t: v.currentTime, rate: v.playbackRate, paused: v.paused, w: innerWidth, h: innerHeight };
  };
</script>
</body>
</html>
